<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet"><link rel="stylesheet" href="/style.css"><title>Gallery</title></head><body>
<main class="wrap"><section><h1>Gallery</h1><p style="color:var(--mute)">Art by anyone in the batch. Add yours and it appears here for everyone.</p>
<form class="up" id="form"><label>Title<input name="title" required maxlength="80"></label>
<label>Your name<input name="by" required maxlength="60"></label>
<label>Image (JPG, PNG, WebP or GIF)<input name="file" type="file" accept="image/*" required></label>
<button class="btn" type="submit">Add artwork</button><div class="status" id="status" role="status"></div></form>
<div class="art" id="art"></div></section></main>
<script type="module">
import {chrome,getArt,artFigure,lightbox} from './site.js';
chrome('art');lightbox(art);
async function load(){const w=await getArt();art.innerHTML=w.map(artFigure).join('')||'<p class="empty">No artwork yet. Add the first piece above.</p>'}
load();
async function shrink(file){
 if(file.type==='image/gif'||file.size<3e6)return file;
 const bmp=await createImageBitmap(file),s=Math.min(1,2200/Math.max(bmp.width,bmp.height)),cv=document.createElement('canvas');
 cv.width=bmp.width*s;cv.height=bmp.height*s;cv.getContext('2d').drawImage(bmp,0,0,cv.width,cv.height);
 return await new Promise(r=>cv.toBlob(r,'image/jpeg',.85));
}
form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='Uploading…';
 try{const d=new FormData(form),f=await shrink(d.get('file'));
  if(f.size>4e6)throw new Error('Image is over 4 MB. Choose a smaller one.');
  const q=new URLSearchParams({title:d.get('title'),by:d.get('by')});
  const r=await fetch('/api/artworks?'+q,{method:'POST',headers:{'content-type':f.type},body:f});
  if(!r.ok)throw new Error((await r.json()).error||'Upload failed.');
  form.reset();status.textContent='Added. Thank you.';load()}
 catch(err){status.textContent=err.message}});
</script></body></html>
